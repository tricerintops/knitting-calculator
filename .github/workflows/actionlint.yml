name: Actionlint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download actionlint
      id: get_actionlint
      run: bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      shell: bash
    - name: Check workflow files
      run: |
        echo "::add-matcher::.github/actionlint-matcher.json"
        "${{ steps.get_actionlint.outputs.executable }}" -color
      shell: bash
